[env:esp32-c3-lcdkit]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200
board_build.flash_mode = dio
build_type = release

; Use Espressif's official ESP32-C3-LCDkit BSP instead of generic TFT_eSPI.
; The BSP owns the GC9A01 SPI setup, backlight and LVGL integration.
