name: Test
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m py_compile server/adsb_suite.py
      - run: bash -n installer/install.sh installer/uninstall.sh
